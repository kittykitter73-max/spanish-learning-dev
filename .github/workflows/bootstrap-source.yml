name: Bootstrap Borao source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-source.yml"
      - ".bootstrap/source.part*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/source.part* > /tmp/borao-source.b64
          base64 -d /tmp/borao-source.b64 > /tmp/borao-source.tar.gz
          tar -xzf /tmp/borao-source.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml

      - name: Commit source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Borao Bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Import Borao v0.6 source"
          git push origin main
