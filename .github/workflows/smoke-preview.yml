name: Smoke test deployed preview

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Preview URL, e.g. https://borao-preview.vercel.app"
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ inputs.base_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run preview smoke tests
        run: node scripts/smoke-preview.mjs
