name: Generate npm lockfile

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git config user.name "Borao CI"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/workflows/generate-lock.yml
          git add package-lock.json .github/workflows/generate-lock.yml
          git commit -m "Add reproducible npm lockfile"
          git push origin main
